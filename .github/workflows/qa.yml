name: Prototype QA

on:
  push:
    branches: [main, feature/research-system]
  pull_request:
    branches: [main, feature/research-system]

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Core and static tests
        run: npm run test:core
      - name: Early browser delivery smoke — existing brewery and new pharmacy
        run: npx playwright test tests/brewery-goods.e2e.spec.mjs tests/chinese-herbal-pharmacy.e2e.spec.mjs --grep "pink beer from brewery|purple cargo can be delivered"
      - name: Browser end-to-end tests
        run: npm run test:e2e
